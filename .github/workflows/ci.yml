name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build -w @ai-assistant/shared
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_assistant
      - run: npm run typecheck -w @ai-assistant/shared
      - run: npm run typecheck -w @ai-assistant/api
      - run: npm run typecheck -w @ai-assistant/web
      - run: npm run test -w @ai-assistant/api
      - run: npm run build -w @ai-assistant/web
